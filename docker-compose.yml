services:
  nexa:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: nexa-backlink
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8020}:8000"
    env_file: .env
    environment:
      APP_DATA_DIR: /data
    volumes:
      - ./data:/data

