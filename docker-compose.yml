services:
  nexa:
    build: .
    container_name: nexa-backlink
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8020}:8000"
    env_file: .env
    environment:
      APP_DATA_DIR: /data
    volumes:
      - ./data:/data
    # Reach Ollama on the host at http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
